sonar.projectKey=Le-Nid_nid
sonar.organization=le-nid


# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=nid
sonar.projectVersion=0.2.1


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=backend/src,frontend/src
sonar.tests=backend/src,frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
# frontend/src/components/ui and shadcn-tailwind.css are vendored shadcn/ui output, kept identical to upstream
# (Sonar's CSS parser also misreads Tailwind v4 at-rules there)
sonar.exclusions=**/*.test.ts,**/*.spec.ts,**/__tests__/**,frontend/src/components/ui/**,frontend/src/styles/shadcn-tailwind.css
# Same exclusion as backend/vite.config.ts coverage: migrations are DDL, checked against a real PostgreSQL
sonar.coverage.exclusions=backend/src/db/migrations/**
sonar.typescript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8