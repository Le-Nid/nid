name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  backend:
    name: Backend — lint / typecheck / tests / SonarCloud
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          flags: backend
          directory: backend/coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: backend/coverage/lcov.info

  frontend:
    name: Frontend — lint / typecheck / tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          flags: frontend
          directory: frontend/coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Dependabot and fork PRs get no repository secrets: skip instead of failing on an empty token
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Download coverage reports
        uses: actions/download-artifact@v8
        with:
          name: coverage-backend
          path: backend/coverage

      - name: Download coverage reports
        uses: actions/download-artifact@v8
        with:
          name: coverage-frontend
          path: frontend/coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The quality gate is decorated on the PR without the issue list; print it here so it is readable from the logs
      - name: List new-code issues
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          task_url=$(grep '^ceTaskUrl=' .scannerwork/report-task.txt | cut -d= -f2-)
          for _ in $(seq 30); do
            status=$(curl -fsS -u "$SONAR_TOKEN:" "$task_url" | jq -r .task.status)
            [ "$status" = SUCCESS ] || [ "$status" = FAILED ] && break
            sleep 5
          done
          curl -fsS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/issues/search?componentKeys=Le-Nid_nid&pullRequest=$PR&inNewCodePeriod=true&resolved=false&types=BUG,CODE_SMELL&ps=100" \
            | jq -r '.issues[] | "\(.type) \(.severity) \(.rule) \(.component | sub("^Le-Nid_nid:"; "")):\(.line // "-") \(.message)"'
