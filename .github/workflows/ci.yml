name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  backend:
    name: Backend — lint / typecheck / tests / SonarCloud
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          flags: backend
          directory: backend/coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: backend/coverage/lcov.info

  backend-imap:
    name: Backend — IMAP integration (Dovecot + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nid
          POSTGRES_PASSWORD: nid
          POSTGRES_DB: nid
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nid" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://nid:nid@localhost:5432/nid
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      GOOGLE_CLIENT_ID: ci
      GOOGLE_CLIENT_SECRET: ci
      GOOGLE_REDIRECT_URI: http://localhost/ci
      LOG_LEVEL: silent
      ARCHIVE_PATH: ${{ runner.temp }}/archives
      IMAP_TEST_HOST: 127.0.0.1
      IMAP_TEST_PORT: '31143'
      IMAP_TEST_PASSWORD: nid-ci
      # The certificate made for 127.0.0.1 below: STARTTLS is verified, nothing is weakened
      NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/dovecot-ssl/tls.crt

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Started here, not as a service: it needs a certificate for 127.0.0.1 (the image's own is for its hostname)
      - name: Start Dovecot
        run: |
          SSL="$RUNNER_TEMP/dovecot-ssl"
          mkdir -p "$SSL"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1" -keyout "$SSL/tls.key" -out "$SSL/tls.crt"
          chmod 644 "$SSL"/*
          docker run -d --name dovecot -p 31143:31143 \
            -e USER_PASSWORD='{PLAIN}nid-ci' \
            -v "$SSL:/etc/dovecot/ssl:ro" \
            dovecot/dovecot:2.4.5
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/31143) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs dovecot
          exit 1

      - name: IMAP integration tests
        run: mkdir -p "$ARCHIVE_PATH" && npm run test:integration

      - name: Dovecot logs
        if: failure()
        run: docker logs dovecot

  frontend:
    name: Frontend — lint / typecheck / tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          flags: frontend
          directory: frontend/coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info

  e2e:
    name: Frontend — e2e (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install --no-audit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run e2e
        env:
          # Ratchet: fail when a page gets more axe violations than e2e/a11y-baseline.json
          E2E_A11Y_STRICT: 1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Dependabot and fork PRs get no repository secrets: skip instead of failing on an empty token
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Download coverage reports
        uses: actions/download-artifact@v8
        with:
          name: coverage-backend
          path: backend/coverage

      - name: Download coverage reports
        uses: actions/download-artifact@v8
        with:
          name: coverage-frontend
          path: frontend/coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The quality gate is decorated on the PR without the issue list; print it here so it is readable from the logs
      - name: List new-code issues
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          task_url=$(grep '^ceTaskUrl=' .scannerwork/report-task.txt | cut -d= -f2-)
          for _ in $(seq 30); do
            status=$(curl -fsS -u "$SONAR_TOKEN:" "$task_url" | jq -r .task.status)
            [ "$status" = SUCCESS ] || [ "$status" = FAILED ] && break
            sleep 5
          done
          curl -fsS -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/issues/search?componentKeys=Le-Nid_nid&pullRequest=$PR&inNewCodePeriod=true&resolved=false&types=BUG,VULNERABILITY,CODE_SMELL&ps=100" \
            | jq -r '.issues[] | "\(.type) \(.severity) \(.rule) \(.component | sub("^Le-Nid_nid:"; "")):\(.line // "-") \(.message)"'
