name: Docker Publish

# - push sur main : image de développement, tags `main` et `sha-<court>`, version `X.Y.Z-main.<sha>`
#   (X.Y.Z = fichier VERSION, donc chaque build a un numéro distinct).
# - appel depuis release-please.yml (release créée) : tags `X.Y.Z`, `X.Y` et `latest`.

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: 'Version publiée (X.Y.Z), fournie par release-please'
        required: true
        type: string

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version and tags
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          image=ghcr.io/le-nid/nid
          short_sha="${GITHUB_SHA::7}"
          if [ -n "$RELEASE_VERSION" ]; then
            version="$RELEASE_VERSION"
            tags="$image:$version,$image:${version%.*},$image:latest"
          else
            version="$(cat VERSION)-main.$short_sha"
            tags="$image:main,$image:sha-$short_sha"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.version.outputs.tags }}
