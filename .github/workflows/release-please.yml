name: Release Please

# Ouvre/maintient une PR de release à partir des commits conventionnels (feat → minor, fix → patch).
# Quand cette PR est mergée : tag vX.Y.Z + GitHub Release, puis publication de l'image versionnée.
# Les tags créés avec GITHUB_TOKEN ne déclenchent pas d'autres workflows, d'où l'appel direct à docker-publish.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
